<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ID Film - Discover and explore amazing movies"
    />
    <meta name="theme-color" content="#1a1a2e" />

    <link rel="icon" href="favicon.png">
    <link rel="manifest" href="app.webmanifest">
    <link rel="apple-touch-icon" href="images/logo.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <title>ID Film - Movie Catalog</title>
  </head>
  <body>
    <a href="#mainContent" class="skip-link">Skip to content</a>

    <header></header>

    <main id="mainContent"></main>

    <footer></footer>

    <!-- Offline notification -->
    <div class="offline-notification" id="offlineNotification">
      <div class="offline-notification__content">
        <i class="fa-solid fa-wifi-slash"></i>
        <p>You're currently offline. Some features may not work properly.</p>
        <button id="closeOfflineNotification" aria-label="Close notification">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
    </div>

    <script>
      // Show offline notification
      window.addEventListener("offline", () => {
        document.getElementById("offlineNotification").classList.add("show");
      });

      // Hide offline notification when back online
      window.addEventListener("online", () => {
        document.getElementById("offlineNotification").classList.remove("show");
      });

      // Close button for offline notification
      document
        .getElementById("closeOfflineNotification")
        .addEventListener("click", () => {
          document
            .getElementById("offlineNotification")
            .classList.remove("show");
        });
    </script>
  </body>
</html>
